services:
  - type: web
    name: tunisair-rag-api
    runtime: docker
    region: frankfurt
    plan: free
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_CHAT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: tunisair-rag-openai-1536
      - key: PINECONE_NAMESPACE
        value: tunisair-fr
      - key: CORS_ORIGINS
        value: '["https://badia3.github.io"]'
